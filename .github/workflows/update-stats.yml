name: Update Statistics

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.42.1
          cache: true

      - name: Fetch GraphQL cursors
        run: pixi run python fetch_cursor_json.py
        env:
          GITHUB_API_TOKEN: ${{ secrets.GH_API_TOKEN }}

      - name: Update PR data
        run: pixi run python update_pr.py
        env:
          GITHUB_API_TOKEN: ${{ secrets.GH_API_TOKEN }}

      - name: Compute statistics
        run: pixi run python update_stats.py
        env:
          GITHUB_API_TOKEN: ${{ secrets.GH_API_TOKEN }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update PR data and statistics [skip ci]"
          git push